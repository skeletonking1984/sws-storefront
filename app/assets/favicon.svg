<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stream Widget Shop">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe6ff"/>
      <stop offset="35%" stop-color="#b79df2"/>
      <stop offset="70%" stop-color="#f2a6d8"/>
      <stop offset="100%" stop-color="#ffd6f2"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="60%" stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#f0a03c"/>
    </radialGradient>
    <clipPath id="tower">
      <path d="M25.5 55 L28 25 h8 l2.5 30 z"/>
    </clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#holo)" stroke="#2a1240" stroke-width="3"/>

  <!-- tower with candy stripes -->
  <g>
    <path d="M25.5 55 L28 25 h8 l2.5 30 z" fill="#fffaf2"/>
    <g clip-path="url(#tower)">
      <rect x="24" y="28.5" width="16" height="5" fill="#f0509a"/>
      <rect x="24" y="38" width="16" height="5.5" fill="#f0509a"/>
      <rect x="24" y="48" width="16" height="6" fill="#f0509a"/>
    </g>
    <path d="M25.5 55 L28 25 h8 l2.5 30 z" fill="none" stroke="#2a1240" stroke-width="2.6" stroke-linejoin="round"/>
  </g>

  <!-- gallery deck -->
  <rect x="24" y="21" width="16" height="4.6" rx="1.6" fill="#8fd7d1" stroke="#2a1240" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- lamp room -->
  <rect x="26.6" y="12.5" width="10.8" height="9" rx="1.4" fill="url(#lamp)" stroke="#2a1240" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- roof -->
  <path d="M25 12.5 q7 -7.5 14 0 z" fill="#8fd7d1" stroke="#2a1240" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32 9.4 v-5.6" stroke="#2a1240" stroke-width="2.6" stroke-linecap="round"/>

  <!-- base -->
  <rect x="21.5" y="54" width="21" height="6.5" rx="2" fill="#8fd7d1" stroke="#2a1240" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
